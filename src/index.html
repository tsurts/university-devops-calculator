<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A calculator. Or two calculators. Or a tank.">
  <title>DevOps Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./" aria-label="Calculator home"><span class="mark" aria-hidden="true">=</span>Calculator</a>
      <nav class="toolbar" aria-label="Calculator controls">
        <button type="button" id="second-toggle" aria-pressed="false" aria-controls="second-calculator">Second calculator</button>
        <button type="button" id="tank-toggle" aria-pressed="false" aria-controls="tank-view">Tank</button>
      </nav>
    </header>
    <div class="stage">
      <section class="calculator primary is-active" aria-label="First calculator">
        <div class="calculator-top"><span>CALCULATOR</span><span class="dot" aria-hidden="true"></span></div>
        <div class="screen"><p class="expression" id="expression">Ready when you are</p><output class="display" id="display" aria-live="polite" aria-atomic="true">0</output></div>
        <div class="keys">
          <button type="button" data-value="clear" class="utility">AC</button>
          <button type="button" data-value="sign" class="utility" aria-label="Change sign">&plusmn;</button>
          <button type="button" data-value="back" class="utility" aria-label="Backspace">&#9003;</button>
          <button type="button" data-value="/" class="operator" aria-label="Divide">&divide;</button>
          <button type="button" data-value="7">7</button><button type="button" data-value="8">8</button><button type="button" data-value="9">9</button>
          <button type="button" data-value="*" class="operator" aria-label="Multiply">&times;</button>
          <button type="button" data-value="4">4</button><button type="button" data-value="5">5</button><button type="button" data-value="6">6</button>
          <button type="button" data-value="-" class="operator" aria-label="Subtract">&minus;</button>
          <button type="button" data-value="1">1</button><button type="button" data-value="2">2</button><button type="button" data-value="3">3</button>
          <button type="button" data-value="+" class="operator" aria-label="Add">+</button>
          <button type="button" data-value="0" class="zero">0</button><button type="button" data-value=".">.</button>
          <button type="button" data-value="=" class="equals" aria-label="Equals">=</button>
        </div>
      </section>
      <div id="tank-view" class="tank-view" hidden><img src="assets/tank.png" alt="An olive-green tank. It does absolutely nothing." width="1536" height="1024"></div>
    </div>
  </main>
</body>
</html>
